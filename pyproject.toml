[project]
name = "tradingagent-hk"
version = "0.1.0"
description = "Multi-agent research system for HK IPO cornerstone investment analysis"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "akshare>=1.14",
    "pandas>=2.0",
    "numpy>=1.26",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "tiktoken>=0.7",
    "loguru>=0.7",
    "jinja2>=3.1",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ta-hk = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.setuptools.package-data]
"src.reports" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
